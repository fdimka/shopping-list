server {
 listen 80;
 server_tokens off;
 root /usr/share/nginx/html;
 index index.html;
 client_max_body_size 32k;
 add_header X-Content-Type-Options nosniff always;
 add_header X-Frame-Options DENY always;
 add_header Referrer-Policy no-referrer always;
 add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self'; img-src 'self' data:; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
 location /catalog/ { proxy_pass http://catalog-api:8080/; proxy_read_timeout 15s; }
 location /orders/ { proxy_pass http://orders-api:3001/; proxy_read_timeout 15s; }
 location / { try_files $uri $uri/ /index.html; }
}

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${SQL_SA_PASSWORD:?Run node scripts/setup.mjs}"
    ports:
      - "127.0.0.1:1433:1433"
    volumes:
      - sql_data:/var/opt/mssql
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q 'SELECT 1' -b -o /dev/null
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  catalog-init:
    build: ./apps/catalog-api
    command: ["--initialize"]
    environment:
      ConnectionStrings__Catalog: "Server=sqlserver,1433;Database=ShoppingCatalog;User Id=sa;Password=${SQL_SA_PASSWORD};TrustServerCertificate=True"
      SQL_APP_PASSWORD: "${SQL_APP_PASSWORD:?Run node scripts/setup.mjs}"
    depends_on:
      sqlserver:
        condition: service_healthy

  catalog-api:
    build: ./apps/catalog-api
    ports:
      - "127.0.0.1:5000:8080"
    environment:
      ConnectionStrings__Catalog: "Server=sqlserver,1433;Database=ShoppingCatalog;User Id=shopping_catalog;Password=${SQL_APP_PASSWORD};TrustServerCertificate=True"
      FrontendOrigin: "http://localhost:5173"
    depends_on:
      catalog-init:
        condition: service_completed_successfully

  mongodb:
    image: mongo:8.0
    environment:
      MONGO_INITDB_ROOT_USERNAME: "${MONGO_ROOT_USERNAME:?Run setup}"
      MONGO_INITDB_ROOT_PASSWORD: "${MONGO_ROOT_PASSWORD:?Run setup}"
      MONGO_APP_USERNAME: "${MONGO_APP_USERNAME:?Run setup}"
      MONGO_APP_PASSWORD: "${MONGO_APP_PASSWORD:?Run setup}"
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo_data:/data/db
      - ./infra/mongo-init.js:/docker-entrypoint-initdb.d/01-orders.js:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mongosh --quiet --username "$$MONGO_INITDB_ROOT_USERNAME" --password "$$MONGO_INITDB_ROOT_PASSWORD" --authenticationDatabase admin --eval "db.adminCommand('ping').ok"
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s

  orders-api:
    build:
      context: .
      dockerfile: apps/orders-api/Dockerfile
    ports:
      - "127.0.0.1:3001:3001"
    environment:
      MONGODB_URI: "mongodb://${MONGO_APP_USERNAME}:${MONGO_APP_PASSWORD}@mongodb:27017/shopping_orders?authSource=shopping_orders"
      FRONTEND_ORIGIN: "http://localhost:5173"
      CATALOG_API_URL: "http://catalog-api:8080"
    depends_on:
      mongodb:
        condition: service_healthy
      catalog-api:
        condition: service_started

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "127.0.0.1:5173:80"
    depends_on:
      catalog-api:
        condition: service_started
      orders-api:
        condition: service_started

  catalog-tests:
    profiles: ["tests"]
    build:
      context: ./apps/catalog-api
      dockerfile: tests/Dockerfile

volumes:
  sql_data:
  mongo_data:
